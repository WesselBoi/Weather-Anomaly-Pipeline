name: Daily Weather Pipeline

on:
  schedule:
    - cron: '37 12 * * *' #R
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill yesterday's actuals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/backfill_actuals.py

      - name: Detect anomalies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/detect_anomalies.py

      - name: Log Open-Meteo forecast
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ingest_forecast.py

      - name: Generate ML predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/predict_ml.py